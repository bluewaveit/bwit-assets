<!-- ================================================================
     BlueWave IT — /includes/nav.html
     Shared navigation component. Loaded by nav.js into #site-nav.
     Active link state set automatically by nav.js based on current URL.
     ================================================================ -->
<header class="site-header" id="siteHeader">

  <div class="container nav-inner">

    <!-- ── Logo ─────────────────────────────────────────────── -->
    <a href="index.html" class="logo" aria-label="BlueWave IT — Home">
      <div class="logo-mark">
        <img
          src="images/logo_dark.png"
          data-dark="images/logo_dark.png"
          data-light="images/logo_light.png"
          alt="BlueWave IT"
          class="logo-img"
          width="44" height="44"
        />
      </div>
      <div class="logo-wordmark">
        <strong>BlueWave IT</strong>
        <span data-i18n="nav_label">Managed IT Services</span>
      </div>
    </a>

    <!-- ── Desktop nav links ─────────────────────────────────── -->
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="index.html"       data-nav-page="index"    data-i18n="nav_home">Home</a>
      <a href="services.html"    data-nav-page="services" data-i18n="nav_services">Services</a>
      <a href="about.html"       data-nav-page="about"    data-i18n="nav_about">About</a>
      <a href="pricing.html"     data-nav-page="pricing"  data-i18n="nav_pricing">Pricing</a>
      <a href="faq.html"          data-nav-page="faq"      data-i18n="nav_faq">FAQ</a>
      <a href="contact.html"     data-nav-page="contact"  data-i18n="nav_contact">Contact</a>
    </nav>

    <!-- ── Nav right: toggles + CTA + hamburger ──────────────── -->
    <div class="nav-right">

      <!-- Theme switcher -->
      <div class="tog nav-theme-tog" role="group" aria-label="Theme switcher">
        <button class="tog-btn active" data-theme="dark"  data-i18n="theme_dark">Dark</button>
        <button class="tog-btn"        data-theme="light" data-i18n="theme_light">Light</button>
      </div>

      <!-- Language switcher -->
      <div class="tog" role="group" aria-label="Language switcher">
        <button class="tog-btn active" data-lang="en">EN</button>
        <button class="tog-btn"        data-lang="pt">PT</button>
      </div>

      <!-- Mobile hamburger -->
      <button
        class="nav-toggle"
        id="navToggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
      >
        <svg class="nav-icon-open"  viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6"  x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="nav-icon-close" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

    </div><!-- /nav-right -->
  </div><!-- /nav-inner -->

  <!-- ── Mobile menu ───────────────────────────────────────────── -->
  <div class="mobile-menu" id="mobileMenu" role="navigation" aria-label="Mobile navigation">
    <div class="container">

      <a href="index.html"       data-nav-page="index"    data-i18n="nav_home">Home</a>
      <a href="services.html"    data-nav-page="services" data-i18n="nav_services">Services</a>
      <a href="about.html"       data-nav-page="about"    data-i18n="nav_about">About</a>
      <a href="pricing.html"     data-nav-page="pricing"  data-i18n="nav_pricing">Pricing</a>
      <a href="faq.html"          data-nav-page="faq"      data-i18n="nav_faq">FAQ</a>
      <a href="contact.html"     data-nav-page="contact"  data-i18n="nav_contact">Contact</a>

      <!-- Theme toggle inside mobile menu -->
      <div class="mobile-menu-theme">
        <div class="tog" role="group" aria-label="Theme switcher">
          <button class="tog-btn active" data-theme="dark"  data-i18n="theme_dark">Dark</button>
          <button class="tog-btn"        data-theme="light" data-i18n="theme_light">Light</button>
        </div>
      </div>

    </div>
  </div><!-- /mobile-menu -->

</header>
